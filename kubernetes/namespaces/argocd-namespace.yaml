apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    # Pod Security Standards enforcement (CONTEXT.md section 14).
    # ArgoCD's own components run fine under "restricted" once
    # securityContext hardening is applied via the Helm values.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: secure-vault-platform
